<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Placeholder player · Moul UI docs</title>
    <!--
      A stand-in for an embedded video player (a YouTube or Vimeo embed URL),
      so the moul-video-dialog demo loads nothing from a third party. Point
      the element's src at your own player instead.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 90% at 80% 10%, #be185d 0%, transparent 55%),
          radial-gradient(120% 90% at 10% 90%, #4338ca 0%, transparent 60%), #120f2e;
        background-size: 160% 160%;
        color: #f8fafc;
        font: 500 clamp(0.875rem, 2.4vw, 1.125rem) / 1.5 system-ui, sans-serif;
        animation: drift 14s ease-in-out infinite alternate;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.25rem, 4.5vw, 2.5rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        max-width: 32rem;
        color: #cbd5e1;
      }

      .bar {
        width: min(28rem, 80vw);
        height: 0.375rem;
        border-radius: 9999px;
        background: rgb(255 255 255 / 0.2);
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: inherit;
        background: #f9a8d4;
        transform-origin: left;
        animation: play 12s linear infinite;
      }

      @keyframes drift {
        to {
          background-position: 100% 100%;
        }
      }

      @keyframes play {
        from {
          transform: scaleX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        .bar span {
          animation: none;
        }

        .bar span {
          transform: scaleX(0.35);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your video plays here</h1>
      <p>
        A placeholder player for the docs. Set <code>src</code> to an embed URL
        or a video file and the dialog plays it in this frame.
      </p>
      <div class="bar" aria-hidden="true"><span></span></div>
    </main>
  </body>
</html>
