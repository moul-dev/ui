name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm trusted publishing: the job trades a GitHub OIDC token for a
  # short-lived npm token, so no npm token is stored in this repository.
  id-token: write

jobs:
  release:
    name: Test, Build, Publish to npm & GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check SemVer Tag
        run: |
          # Releases are tagged vMAJOR.MINOR.PATCH with an optional prerelease, e.g. v1.0.0-alpha.2.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not SemVer vMAJOR.MINOR.PATCH[-prerelease] (e.g. v1.0.0-alpha.2). Bump with 'bun run bump <major|minor|patch|prerelease>'."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Tag Matches ui/package.json
        run: |
          version="$(jq -r .version ui/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ui/package.json version $version. Run 'bun run bump' and commit before tagging."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun run test

      - name: Build Library
        run: bun run build:ui

      # The README in the tarball and the docs' llms files are generated from the
      # manifest; this fails when they were not regenerated after an API change.
      - name: Check Generated Docs Match the Manifest
        run: bun run sync:llms

      - name: Pack npm Tarball
        run: |
          mkdir -p release
          cd ui && bun pm pack --destination ../release

      - name: Set up Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Publishes the same tarball the GitHub release attaches. Needs a trusted
      # publisher on npmjs.com (package settings → Trusted publishing → GitHub
      # Actions, this repository, workflow `release.yml`); if the step fails for
      # want of one, add it and re-run the job. A re-run skips a version npm
      # already has, so a failure in a later step can be retried too.
      - name: Publish to npm
        run: |
          version="$(jq -r .version ui/package.json)"
          if npm view "@moul-dev/web-component@$version" version >/dev/null 2>&1; then
            echo "::notice::@moul-dev/web-component@$version is already on npm; skipping publish."
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          npm install --global npm@^11.5.1
          # npm refuses a prerelease without an explicit tag. Alphas take latest
          # on purpose, like the GitHub release below, until 1.0.0. npm adds
          # provenance by itself when the repository is public.
          npm publish release/*.tgz --access public --tag latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          draft: false
          # Alphas stay ordinary releases, like the Moul engine's, so the repository shows the
          # newest one as Latest; npm's latest dist-tag also follows the alphas until 1.0.0.
          prerelease: false
          generate_release_notes: true
